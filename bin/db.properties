# Flight Booking System - Database Configuration
# MySQL Database Connection Properties

# Database URL
# Format: jdbc:mysql://hostname:port/database_name
db.url=jdbc:mysql://localhost:3305/flight_booking_system

# Database username
db.username=root

# Database password
db.password=

# Additional MySQL connection properties (optional)
# Use SSL connection
db.useSSL=false

# Server timezone
db.serverTimezone=UTC

# Allow public key retrieval
db.allowPublicKeyRetrieval=true

# Connection timeout (milliseconds)
db.connectTimeout=10000

# Auto-reconnect
db.autoReconnect=true

# Maximum number of reconnects
db.maxReconnects=3